{% extends "base.html" %}

{% block title %}Schedule{% endblock title %}

{% block content %}
{% for schedule in schedule_list %}
<div class="card">
    <div class="card-header">
        <span class="fw-bold">{{ schedule.date_range }}</span>
    </div>
    <div class="card-body">
        <img src="{{ schedule.image }}">
    </div>
</div>
<br />
{% endfor %}
{% endblock content %}
